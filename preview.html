<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SabuyJukebox — UI Preview (mock)</title>
<!--
  Standalone visual preview of the SabuyJukebox client. No server, no build,
  no install — just open this file in a browser. All data here is fake; nothing
  is downloaded or played. For the real app, see README.md / DEPLOY.md.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#100c14;color:#f5ede7;font-family:'DM Sans',system-ui,sans-serif;
       min-height:100vh;background:radial-gradient(120% 90% at 80% -10%,#241428 0%,#160f1c 45%,#100c14 100%)}
  .bg-grotesque{font-family:'Bricolage Grotesque',sans-serif}
  ::selection{background:rgba(255,107,0,.3)}
  @keyframes eq{0%{transform:scaleY(.22)}100%{transform:scaleY(1)}}
  @keyframes toastin{0%{transform:translate(-50%,20px);opacity:0}100%{transform:translate(-50%,0);opacity:1}}
  .eqbar{transform-origin:bottom;border-radius:2px}
  .clickable{cursor:pointer}
  .ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:80;background:rgba(255,107,0,.14);color:#ffb47d;border:1px solid rgba(255,107,0,.35);padding:5px 14px;border-radius:999px;font-size:11.5px;font-weight:600">
  UI PREVIEW · mock · public sees Employee only — try #admin / #player in the URL
</div>

<!-- NAV -->
<div style="position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:13px 26px;background:rgba(22,16,26,.82);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06)">
  <div style="display:flex;align-items:center;gap:11px;flex:1;min-width:0">
    <div style="width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#ff6b00,#0099a8);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff">♪</div>
    <div class="bg-grotesque" style="font-weight:700;font-size:19px;letter-spacing:-.02em">Sabuy<span style="color:#ff6b00">Jukebox</span></div>
  </div>
  <div id="tabs" style="display:flex;gap:4px;background:#241c2b;padding:4px;border-radius:14px"></div>
  <div style="flex:1;display:flex;justify-content:flex-end;align-items:center;gap:10px">
    <div style="display:flex;align-items:center;gap:7px;font-size:12px;color:#7fe3da"><span class="eqbar" style="width:7px;height:7px;border-radius:50%;background:#0fd0c0;display:inline-block;animation:eq 1.2s ease-in-out infinite alternate"></span>Live</div>
    <div style="display:flex;align-items:center;gap:8px;background:rgba(255,107,0,.13);color:#ffb47d;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600">You · <span id="myCount">1</span>/3</div>
  </div>
</div>

<div id="view"></div>
<div id="toast"></div>

<script>
// ---- mock state ----------------------------------------------------------
const EMOJI = { fire:"🔥", heart:"❤️", joy:"😂", party:"🎉" };
const PAL = ["linear-gradient(135deg,#ff6b00,#e0448a)","linear-gradient(135deg,#0099a8,#00c2b0)","linear-gradient(135deg,#c77dff,#7b2ff7)","linear-gradient(135deg,#ffb03a,#ff6b00)","linear-gradient(135deg,#5ec6d2,#0099a8)"];
const g = t => { let h=0; for(const c of t) h=(h+c.charCodeAt(0))%PAL.length; return PAL[h]; };

const state = {
  tab: "employee",
  query: "",
  paused: false,
  elapsed: 108,
  np: { title:"Golden Hour", channel:"JVKE", requester:"Ploy", initial:"P", dur:208, gradient:"linear-gradient(135deg,#ff6b00,#b23c8e)" },
  reactions: { fire:7, heart:3, joy:1, party:2 },
  queue: [
    { id:1, title:"Levitating", channel:"Dua Lipa", requester:"You", dur:203, status:"ready", progress:100, mine:true, gradient:g("Levitating") },
    { id:2, title:"As It Was", channel:"Harry Styles", requester:"Bank", dur:167, status:"ready", progress:100, mine:false, gradient:g("As It Was") },
    { id:3, title:"Flowers", channel:"Miley Cyrus", requester:"Nan", dur:200, status:"ready", progress:100, mine:false, gradient:g("Flowers") },
    { id:4, title:"Anti-Hero", channel:"Taylor Swift", requester:"Tar", dur:200, status:"downloading", progress:62, mine:false, gradient:g("Anti-Hero") },
  ],
  cachedCount: 3,
  settings: { maxDurationMin:10, queueLimit:30, perUserLimit:3, autoCleanup:true },
};

const CATALOG = [
  { title:"Blinding Lights", channel:"The Weeknd", dur:200 },
  { title:"good 4 u", channel:"Olivia Rodrigo", dur:178 },
  { title:"Sunroof", channel:"Nicky Youre", dur:163 },
  { title:"Morning Coffee Jazz", channel:"Café Music BGM", dur:245 },
];

const fmt = s => { s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
const $ = id => document.getElementById(id);
const el = (html) => { const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstElementChild; };

function toast(msg){
  const t=$("toast");
  t.innerHTML = `<div style="position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;background:#2c2231;border:1px solid rgba(255,107,0,.4);color:#f5ede7;padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 16px 40px -12px rgba(0,0,0,.6);animation:toastin .25s ease">${msg}</div>`;
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.innerHTML="",2200);
}

function myCount(){ return state.queue.filter(q=>q.mine).length + (state.np && state.np.requester==="You"?1:0); }

// ---- render --------------------------------------------------------------
function render(){
  $("myCount").textContent = myCount();
  renderTabs();
  const v=$("view");
  v.innerHTML="";
  if(state.tab==="employee") v.appendChild(renderEmployee());
  else if(state.tab==="admin") v.appendChild(renderAdmin());
  else v.appendChild(renderPlayer());
}

function renderTabs(){
  // Public nav shows Employee only. Admin/Player are reached by URL hash
  // (#admin / #player) — mirroring the real app's /admin and /player routes.
  const tabs=$("tabs"); tabs.innerHTML="";
  const label = state.tab==="admin" ? "Admin" : state.tab==="player" ? "Player" : "Employee";
  const chip = el(`<div style="padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;background:#ff6b00;color:#fff">${label}</div>`);
  tabs.appendChild(chip);
}

function eqbars(colors,h,w){
  return `<span style="display:inline-flex;gap:${w>3?4:2}px;align-items:flex-end;height:${h}px">`+
    colors.map((c,i)=>`<span class="eqbar" style="width:${w}px;height:${h}px;background:${c};animation:eq ${.5+i*.14}s ${i*.05}s ease-in-out infinite alternate"></span>`).join("")+`</span>`;
}

function reactionsBar(big){
  return Object.keys(EMOJI).map(k=>{
    const c=state.reactions[k];
    return `<div class="clickable rx" data-k="${k}" style="display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);padding:7px 12px;border-radius:999px;user-select:none">
      <span style="font-size:${big?22:16}px">${EMOJI[k]}</span>${c>0?`<span style="font-size:12px;font-weight:700">${c}</span>`:""}</div>`;
  }).join("");
}

function renderEmployee(){
  const np=state.np;
  const npProg = np ? Math.min(100,(state.elapsed/np.dur)*100) : 0;
  const results = state.query.trim().length>1 ? CATALOG.slice(0,3) : [];
  const eta = (()=>{ let acc = np ? np.dur-state.elapsed : 0; for(const q of state.queue){ if(q.mine) return fmt(acc); acc+=q.dur; } return null; })();

  const wrap = el(`<div style="max-width:680px;margin:0 auto;padding:30px 26px 90px"></div>`);
  wrap.innerHTML = `
    <div class="bg-grotesque" style="font-weight:700;font-size:27px;letter-spacing:-.02em;margin:0 0 4px">What should we play next? 🎶</div>
    <div style="color:#9a8ca0;font-size:14px;margin-bottom:18px">Paste a YouTube link or search — we download it, then it joins the queue.</div>
    <div style="display:flex;align-items:center;gap:12px;background:#2c2231;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:6px 6px 6px 16px">
      <span style="color:#8f8195;display:flex"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
      <input id="q" value="${state.query.replace(/"/g,'&quot;')}" placeholder="Search a song, artist, or paste a link…" style="flex:1;background:transparent;border:none;outline:none;color:#f5ede7;font-size:15px;padding:10px 0"/>
      <div id="addTop" class="clickable" style="background:#ff6b00;color:#fff;font-weight:600;font-size:13px;padding:11px 18px;border-radius:11px">Add</div>
    </div>
    ${results.length?`<div style="margin-top:10px;background:#241c2b;border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden">${results.map((r,i)=>`
      <div style="display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid rgba(255,255,255,.04)">
        <div style="width:52px;height:38px;border-radius:8px;flex:none;background:${g(r.title)}"></div>
        <div style="flex:1;min-width:0"><div class="ellip" style="font-weight:600;font-size:13.5px">${r.title}</div><div style="font-size:12px;color:#9a8ca0">${r.channel} · ${fmt(r.dur)}</div></div>
        ${i===0?`<div style="font-size:10.5px;color:#0fd0c0;background:rgba(0,153,168,.16);padding:3px 8px;border-radius:999px;font-weight:700;white-space:nowrap">Top match</div>`:""}
        <div class="clickable addRes" data-i="${i}" style="width:30px;height:30px;border-radius:9px;background:#ff6b00;color:#fff;display:flex;align-items:center;justify-content:center;flex:none"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></div>
      </div>`).join("")}</div>`:""}
    ${np?`<div style="position:relative;margin-top:22px;background:linear-gradient(135deg,rgba(255,107,0,.14),rgba(0,153,168,.12));border:1px solid rgba(255,107,0,.2);border-radius:16px;padding:16px;overflow:hidden">
      <div id="empLayer" style="position:absolute;inset:0;pointer-events:none;overflow:hidden"></div>
      <div style="display:flex;align-items:center;gap:14px;position:relative">
        <div style="width:56px;height:56px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;color:rgba(255,255,255,.85);background:${np.gradient}">♫</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#ffb47d;font-weight:700;display:flex;align-items:center;gap:7px">Now playing ${eqbars(["#ff6b00","#ff6b00","#ff6b00"],12,3)}</div>
          <div class="ellip" style="font-weight:700;font-size:15.5px;margin-top:2px">${np.title}</div>
          <div style="font-size:12px;color:#c9b9cf">${np.channel} · requested by ${np.requester}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:13px;font-size:11px;color:#c9b9cf;position:relative">
        <span>${fmt(state.elapsed)}</span>
        <div style="flex:1;height:6px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden"><div style="height:100%;background:linear-gradient(90deg,#ff6b00,#ff9b52);width:${npProg}%"></div></div>
        <span>${fmt(np.dur)}</span>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px;position:relative">${reactionsBar(false)}</div>
    </div>`:`<div style="margin-top:22px;padding:28px;text-align:center;background:#241c2b;border:1px dashed rgba(255,255,255,.14);border-radius:16px;color:#9a8ca0">Nothing playing right now — add the first song! 🎧</div>`}
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px">
      <div class="bg-grotesque" style="font-weight:700;font-size:16px">Up next · ${state.queue.length} songs</div>
      ${eta?`<div style="font-size:12px;color:#0fd0c0;font-weight:700">Your song in ~${eta}</div>`:""}
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">${state.queue.map((q,i)=>{
      const dl=q.status==="downloading";
      return `<div style="display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;${q.mine?"background:rgba(0,153,168,.1);border:1px solid rgba(0,153,168,.3)":"border:1px solid transparent"}">
        <div style="width:22px;text-align:center;color:${q.mine?"#0fd0c0":"#8f8195"};font-weight:700;font-size:13px">${i+1}</div>
        <div style="width:42px;height:42px;border-radius:9px;flex:none;position:relative;overflow:hidden;background:${dl?"#3a2f42":q.gradient}">${dl?`<div style="position:absolute;inset:0;background:rgba(20,12,24,.72);display:flex;align-items:center;justify-content:center;font-size:10px;color:#ffb47d;font-weight:700">↓${Math.floor(q.progress)}%</div>`:""}</div>
        <div style="flex:1;min-width:0"><div class="ellip" style="font-weight:600;font-size:13.5px">${q.title}</div><div style="font-size:11.5px;color:${dl?"#ffb47d":"#9a8ca0"}">${dl?"Downloading…":q.channel+" · "+q.requester}</div></div>
        ${q.mine?`<div style="background:rgba(0,153,168,.2);color:#7fe3da;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap">Your song</div>`:""}
        <div style="font-size:11.5px;color:#9a8ca0;white-space:nowrap">${fmt(q.dur)}</div>
        ${q.mine?`<div class="clickable rm" data-id="${q.id}" style="width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.06);color:#cbbcd0;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none">×</div>`:""}
      </div>`;
    }).join("")}</div>`;

  const q=wrap.querySelector("#q");
  q.oninput=e=>{ state.query=e.target.value; render(); setTimeout(()=>{const n=$("view").querySelector("#q"); if(n){n.focus();n.selectionStart=n.selectionEnd=n.value.length;}},0); };
  q.onkeydown=e=>{ if(e.key==="Enter") addTop(); };
  wrap.querySelector("#addTop").onclick=addTop;
  wrap.querySelectorAll(".addRes").forEach(b=>b.onclick=()=>{ const r=CATALOG[+b.dataset.i]; addSong(r,true); });
  wrap.querySelectorAll(".rm").forEach(b=>b.onclick=()=>{ state.queue=state.queue.filter(x=>x.id!=b.dataset.id); render(); });
  wrap.querySelectorAll(".rx").forEach(b=>b.onclick=()=>{ const k=b.dataset.k; state.reactions[k]++; spawn($("empLayer"),EMOJI[k],false); render(); });
  return wrap;
}

function addTop(){ if(state.query.trim().length>1){ addSong(CATALOG[0],true); } else if(state.query.trim()){ addSong({title:state.query.trim(),channel:"YouTube",dur:180},true);} }
function addSong(c,mine){
  if(mine && myCount()>=state.settings.perUserLimit){ toast("You’ve hit your "+state.settings.perUserLimit+"-song limit 🙏"); return; }
  const id=Date.now();
  state.queue.push({ id, title:c.title, channel:c.channel, requester:mine?"You":"Guest", dur:c.dur, status:"downloading", progress:0, mine:!!mine, gradient:g(c.title) });
  state.query=""; toast('Added “'+c.title+'” — downloading…'); render();
}

function renderAdmin(){
  const np=state.np;
  const downloads=state.queue.filter(q=>q.status==="downloading");
  const total=state.queue.reduce((a,q)=>a+q.dur,0)+(np?np.dur-state.elapsed:0);
  const btn="display:flex;align-items:center;gap:7px;background:#2c2231;border:1px solid rgba(255,255,255,.09);color:#f0e6d8;padding:9px 15px;border-radius:11px;font-size:13px;font-weight:600";
  const step="width:24px;height:24px;border-radius:7px;background:#2c2231;display:flex;align-items:center;justify-content:center";

  const wrap=el(`<div style="max-width:1020px;margin:0 auto;padding:26px 26px 90px"></div>`);
  wrap.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px">
      <div><div class="bg-grotesque" style="font-weight:700;font-size:22px;letter-spacing:-.02em">Admin Console</div><div style="font-size:12px;color:#9a8ca0">Controls the live player</div></div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <div id="pp" class="clickable" style="${btn}">${state.paused?"▶ Play":"❚❚ Pause"}</div>
        <div id="skip" class="clickable" style="${btn}"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M6 5v14l9-7z" fill="currentColor"/><rect x="16" y="5" width="3" height="14" rx="1" fill="currentColor"/></svg>Skip</div>
        <div class="clickable" style="${btn}"><svg width="12" height="12" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>Stop</div>
        <div id="clearq" class="clickable" style="${btn};background:rgba(224,68,68,.14);border:1px solid rgba(224,68,68,.35);color:#ff8f8f">Clear queue</div>
      </div>
    </div>
    <div style="display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap">
      <div style="flex:1.6;min-width:340px;background:#1c1622;border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:18px 20px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><div class="bg-grotesque" style="font-weight:700;font-size:15px">Queue</div><div style="font-size:12px;color:#9a8ca0">${state.queue.length} songs · ${fmt(total)}</div></div>
        ${np?`<div style="display:flex;align-items:center;gap:11px;background:linear-gradient(135deg,rgba(255,107,0,.14),rgba(0,153,168,.1));border:1px solid rgba(255,107,0,.25);border-radius:12px;padding:10px 12px;margin-bottom:10px">
          <div style="width:40px;height:40px;border-radius:9px;flex:none;background:${np.gradient}"></div>
          <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13.5px">${np.title}<span style="font-size:10px;color:#ff9b52;background:rgba(255,107,0,.16);padding:2px 7px;border-radius:999px;margin-left:6px;font-weight:700">${state.paused?"PAUSED":"PLAYING"}</span></div><div style="font-size:11.5px;color:#9a8ca0">${np.channel} · ${np.requester} · ${fmt(np.dur)}</div></div>
        </div>`:""}
        <div style="display:flex;flex-direction:column;gap:8px">${state.queue.map((q,i)=>{
          const dl=q.status==="downloading";
          return `<div style="display:flex;align-items:center;gap:10px;background:#241c2b;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:9px 11px">
            <div style="display:flex;flex-direction:column;gap:1px">
              <div class="clickable up" data-id="${q.id}" style="width:20px;height:16px;display:flex;align-items:center;justify-content:center;color:${i===0?"#3a3040":"#8f8195"}"><svg width="13" height="13" viewBox="0 0 24 24"><path d="M12 8l6 7H6z" fill="currentColor"/></svg></div>
              <div class="clickable down" data-id="${q.id}" style="width:20px;height:16px;display:flex;align-items:center;justify-content:center;color:${i===state.queue.length-1?"#3a3040":"#8f8195"}"><svg width="13" height="13" viewBox="0 0 24 24"><path d="M12 16l-6-7h12z" fill="currentColor"/></svg></div>
            </div>
            <div style="width:38px;height:38px;border-radius:9px;flex:none;position:relative;overflow:hidden;background:${dl?"#3a2f42":q.gradient}">${dl?`<div style="position:absolute;inset:0;background:rgba(20,12,24,.72);display:flex;align-items:center;justify-content:center;font-size:9px;color:#ffb47d;font-weight:700">${Math.floor(q.progress)}%</div>`:""}</div>
            <div style="flex:1;min-width:0"><div class="ellip" style="font-weight:600;font-size:13px">${q.title}</div><div style="font-size:11px;color:#9a8ca0">${dl?"Downloading "+Math.floor(q.progress)+"%":q.channel+" · "+q.requester+" · "+fmt(q.dur)}</div></div>
            ${q.status==="ready"?`<div class="clickable playnow" data-id="${q.id}" style="display:flex;align-items:center;gap:5px;color:#0fd0c0;font-size:12px;font-weight:600;background:rgba(0,153,168,.14);padding:6px 10px;border-radius:9px;white-space:nowrap"><svg width="11" height="11" viewBox="0 0 24 24"><path d="M7 5v14l12-7z" fill="currentColor"/></svg>Play now</div>`:""}
            <div class="clickable rm" data-id="${q.id}" style="width:28px;height:28px;border-radius:8px;background:rgba(224,68,68,.12);color:#ff8f8f;display:flex;align-items:center;justify-content:center;flex:none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M5 7h14M10 7V5h4v2M8 7l1 12h6l1-12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          </div>`;}).join("")}</div>
      </div>
      <div style="flex:1;min-width:280px;display:flex;flex-direction:column;gap:16px">
        <div style="background:#1c1622;border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:18px 20px">
          <div class="bg-grotesque" style="font-weight:700;font-size:15px;margin-bottom:12px">Downloads</div>
          ${downloads.length===0?`<div style="display:flex;align-items:center;gap:8px;background:#241c2b;border:1px solid rgba(255,255,255,.06);border-radius:11px;padding:10px 12px;font-size:12.5px;color:#7fe3da"><span style="width:7px;height:7px;border-radius:50%;background:#0fd0c0;display:inline-block"></span>All caught up · ${state.cachedCount} cached files</div>`:downloads.map(d=>`<div style="background:#241c2b;border:1px solid rgba(255,255,255,.06);border-radius:11px;padding:10px 12px;margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px"><span style="font-weight:600">${d.title}</span><span style="font-weight:600;color:#ff9b52">${Math.floor(d.progress)}%</span></div><div style="height:6px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden"><div style="height:100%;width:${Math.floor(d.progress)}%;background:linear-gradient(90deg,#ff6b00,#ff9b52)"></div></div></div>`).join("")}
        </div>
        <div style="background:#1c1622;border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:18px 20px">
          <div class="bg-grotesque" style="font-weight:700;font-size:15px;margin-bottom:12px">Config</div>
          <div style="display:flex;flex-direction:column;gap:9px;font-size:13px">
            <div style="display:flex;align-items:center;justify-content:space-between;background:#241c2b;border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:9px 12px"><span style="color:#c9b9cf">Max duration</span><div style="display:flex;align-items:center;gap:8px"><div class="clickable mdd" style="${step}">−</div><span style="font-weight:600;min-width:52px;text-align:center">${state.settings.maxDurationMin} min</span><div class="clickable mdu" style="${step}">+</div></div></div>
            <div style="display:flex;align-items:center;justify-content:space-between;background:#241c2b;border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:9px 12px"><span style="color:#c9b9cf">Queue limit</span><span style="font-weight:600;background:#2c2231;padding:3px 10px;border-radius:7px">${state.settings.queueLimit} songs</span></div>
            <div style="display:flex;align-items:center;justify-content:space-between;background:#241c2b;border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:9px 12px"><span style="color:#c9b9cf">Per-user limit</span><div style="display:flex;align-items:center;gap:8px"><div class="clickable pud" style="${step}">−</div><span style="font-weight:600;min-width:52px;text-align:center">${state.settings.perUserLimit} songs</span><div class="clickable puu" style="${step}">+</div></div></div>
            <div id="cleanup" class="clickable" style="display:flex;align-items:center;justify-content:space-between;background:#241c2b;border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:9px 12px"><span style="color:#c9b9cf">Auto-cleanup cache</span><span style="width:38px;height:22px;border-radius:99px;position:relative;flex:none;background:${state.settings.autoCleanup?"#0099a8":"rgba(255,255,255,.15)"}"><span style="position:absolute;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;left:${state.settings.autoCleanup?"18px":"2px"}"></span></span></div>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;background:rgba(224,68,68,.1);border:1px solid rgba(224,68,68,.3);border-radius:14px;padding:12px 15px">
          <div><div style="font-weight:600;font-size:13px;color:#ff8f8f">Danger zone</div><div style="font-size:11px;color:#c99">Wipe queue, history &amp; cache</div></div>
          <div id="cleardata" class="clickable" style="background:#e04444;color:#fff;font-weight:600;font-size:12.5px;padding:9px 14px;border-radius:9px">Clear data</div>
        </div>
      </div>
    </div>`;

  wrap.querySelector("#pp").onclick=()=>{ state.paused=!state.paused; render(); };
  wrap.querySelector("#skip").onclick=()=>{ const n=state.queue.shift(); if(n){ state.np={...n,initial:(n.requester||"?")[0]}; state.elapsed=0; } render(); };
  wrap.querySelector("#clearq").onclick=()=>{ state.queue=[]; toast("Queue cleared"); render(); };
  wrap.querySelector("#cleanup").onclick=()=>{ state.settings.autoCleanup=!state.settings.autoCleanup; render(); };
  wrap.querySelector("#cleardata").onclick=()=>{ state.queue=[]; state.np=null; toast("All data wiped 🧹"); render(); };
  wrap.querySelector(".mdu").onclick=()=>{ state.settings.maxDurationMin=Math.min(30,state.settings.maxDurationMin+1); render(); };
  wrap.querySelector(".mdd").onclick=()=>{ state.settings.maxDurationMin=Math.max(1,state.settings.maxDurationMin-1); render(); };
  wrap.querySelector(".puu").onclick=()=>{ state.settings.perUserLimit=Math.min(10,state.settings.perUserLimit+1); render(); };
  wrap.querySelector(".pud").onclick=()=>{ state.settings.perUserLimit=Math.max(1,state.settings.perUserLimit-1); render(); };
  wrap.querySelectorAll(".up").forEach(b=>b.onclick=()=>move(b.dataset.id,-1));
  wrap.querySelectorAll(".down").forEach(b=>b.onclick=()=>move(b.dataset.id,1));
  wrap.querySelectorAll(".rm").forEach(b=>b.onclick=()=>{ state.queue=state.queue.filter(x=>x.id!=b.dataset.id); render(); });
  wrap.querySelectorAll(".playnow").forEach(b=>b.onclick=()=>{ const q=state.queue.find(x=>x.id==b.dataset.id); if(q){ state.queue=state.queue.filter(x=>x.id!=q.id); state.np={...q,initial:(q.requester||"?")[0]}; state.elapsed=0; toast("Now playing that one ▶"); render(); } });
  return wrap;
}
function move(id,dir){ const i=state.queue.findIndex(x=>x.id==id); const j=i+dir; if(i<0||j<0||j>=state.queue.length) return; [state.queue[i],state.queue[j]]=[state.queue[j],state.queue[i]]; render(); }

function renderPlayer(){
  const np=state.np;
  const npProg = np ? Math.min(100,(state.elapsed/np.dur)*100) : 0;
  const next=state.queue.filter(q=>q.status==="ready").slice(0,3);
  const wrap=el(`<div style="max-width:1040px;margin:0 auto;padding:22px 26px 60px"></div>`);
  wrap.innerHTML=`
    <div style="position:relative;height:560px;background:radial-gradient(120% 120% at 15% 10%,#2a1a2e 0%,#161018 55%,#101018 100%);border-radius:22px;overflow:hidden;box-shadow:0 30px 70px -28px rgba(0,0,0,.7);display:flex;flex-direction:column;padding:34px 40px">
      <div id="plLayer" style="position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2">
        <div style="display:flex;align-items:center;gap:12px"><div style="width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#ff6b00,#0099a8);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff">♪</div><div class="bg-grotesque" style="font-weight:700;font-size:21px;letter-spacing:-.02em">Sabuy<span style="color:#ff6b00">Jukebox</span></div></div>
        <div style="display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);padding:8px 8px 8px 16px;border-radius:14px"><div style="text-align:right"><div style="font-size:11px;color:#9a8ca0">Add a song from your desk</div><div style="font-size:13px;font-weight:600;color:#ffb47d">music.office.local</div></div><div style="width:44px;height:44px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;color:#000;font-size:9px;font-family:ui-monospace,monospace;line-height:1;text-align:center">▚▙▜<br>▛▟▚<br>▜▙▛</div></div>
      </div>
      ${np?`<div style="flex:1;display:flex;align-items:center;gap:42px;margin-top:6px;position:relative;z-index:2">
        <div style="width:250px;height:250px;border-radius:24px;flex:none;display:flex;align-items:center;justify-content:center;font-size:80px;color:rgba(255,255,255,.9);box-shadow:0 24px 60px -18px rgba(255,107,0,.5);background:${np.gradient}">♫</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:12px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#ff9b52;font-weight:700">Now playing ${eqbars(["#ff6b00","#0099a8","#e0448a","#0099a8","#ff6b00"],26,5)}</div>
          <div class="bg-grotesque ellip" style="font-weight:800;font-size:48px;letter-spacing:-.03em;line-height:1.02;margin:12px 0 6px">${np.title}</div>
          <div style="font-size:20px;color:#c9b9cf">${np.channel}</div>
          <div style="display:inline-flex;align-items:center;gap:8px;margin-top:16px;background:rgba(0,153,168,.16);padding:6px 14px 6px 6px;border-radius:999px"><div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#0099a8,#00c2b0);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff">${np.initial}</div><span style="font-size:14px;color:#7fe3da;font-weight:600">requested by ${np.requester}</span></div>
          <div style="display:flex;align-items:center;gap:12px;margin-top:22px;font-size:14px;color:#c9b9cf"><span>${fmt(state.elapsed)}</span><div style="flex:1;height:8px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden"><div style="height:100%;background:linear-gradient(90deg,#ff6b00,#e0448a);width:${npProg}%"></div></div><span>${fmt(np.dur)}</span></div>
          <div style="display:flex;gap:16px;margin-top:18px">${Object.keys(EMOJI).map(k=>`<div style="display:flex;align-items:center;gap:6px;font-size:22px">${EMOJI[k]}${state.reactions[k]>0?`<span style="font-size:16px;font-weight:700;color:#c9b9cf">${state.reactions[k]}</span>`:""}</div>`).join("")}</div>
        </div>
      </div>`:`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative;z-index:2"><div style="font-size:60px;opacity:.5">🎧</div><div class="bg-grotesque" style="font-weight:700;font-size:26px;color:#c9b9cf">Waiting for the first song…</div><div style="font-size:15px;color:#8f8195">Scan the code to add one from your desk</div></div>`}
      <div style="display:flex;align-items:center;gap:16px;margin-top:8px;position:relative;z-index:2">
        <div style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8f8195;font-weight:700;white-space:nowrap">Up next</div>
        <div style="display:flex;gap:12px;flex:1;overflow:hidden">${next.map(n=>`<div style="display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 14px 8px 8px;flex:1;min-width:0"><div style="width:36px;height:36px;border-radius:8px;flex:none;background:${n.gradient}"></div><div style="min-width:0"><div class="ellip" style="font-weight:600;font-size:13px">${n.title}</div><div class="ellip" style="font-size:11px;color:#9a8ca0">${n.channel}</div></div></div>`).join("")}</div>
      </div>
    </div>`;
  return wrap;
}

// emoji burst
function spawn(layer,emoji,big){
  if(!layer) return;
  const e=document.createElement("div"); e.textContent=emoji;
  e.style.cssText=`position:absolute;bottom:10px;left:${10+Math.random()*70}%;font-size:${big?40:22}px;pointer-events:none`;
  layer.appendChild(e);
  const dx=Math.random()*60-30;
  e.animate([{transform:"translate(0,0) scale(.6)",opacity:0},{transform:`translate(${dx*.4}px,-40px) scale(1.1)`,opacity:1,offset:.2},{transform:`translate(${dx}px,-${big?300:150}px) scale(1)`,opacity:0}],{duration:big?2200:1600,easing:"cubic-bezier(.4,0,.2,1)"}).onfinish=()=>e.remove();
}

// simulate progress + downloads ticking (visual only)
setInterval(()=>{
  let dirty=false;
  state.queue.forEach(q=>{ if(q.status==="downloading"){ q.progress=Math.min(100,q.progress+7); if(q.progress>=100) q.status="ready"; dirty=true; } });
  if(state.np && !state.paused){ state.elapsed+=1; if(state.elapsed>=state.np.dur){ const n=state.queue.shift(); if(n){ state.np={...n,initial:(n.requester||"?")[0]}; } else state.np=null; state.elapsed=0; } dirty=true; }
  if(dirty) render();
},1000);

// Route by URL hash: #admin / #player, default employee.
function applyHash(){
  const h=(location.hash||"").replace("#","").toLowerCase();
  state.tab = (h==="admin"||h==="player") ? h : "employee";
  render();
}
window.addEventListener("hashchange", applyHash);
applyHash();
</script>
</body>
</html>
